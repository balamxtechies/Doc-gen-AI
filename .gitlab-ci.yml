stages:
  - test
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

# ==========================================
# 1. Test Stage: Run automated tests
# ==========================================
run-tests:
  stage: test
  image: python:3.12-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends libgl1 libglib2.0-0
    - pip install --no-cache-dir -r requirements.txt
  script:
    - python tests/test_server.py
  only:
    - merge_requests
    - main
    - master

# ==========================================
# 2. Build Stage: Build & Push Docker Image
# ==========================================
build-docker-image:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE_TAG .
    - docker tag $IMAGE_TAG $CI_REGISTRY_IMAGE:latest
    - docker push $IMAGE_TAG
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - main
    - master

# ==========================================
# 3. Deploy Stage: Deploy to Remote Server/VM
# (Configure SSH_PRIVATE_KEY & SERVER_IP in GitLab CI/CD Variables)
# ==========================================
deploy-to-server:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null 2>&1 || true
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts || true
  script:
    - echo "Deploying DocuGen AI to production server..."
    # Example SSH deployment:
    # - ssh $SERVER_USER@$SERVER_IP "docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY && docker pull $CI_REGISTRY_IMAGE:latest && docker stop docugen_ai_platform || true && docker rm docugen_ai_platform || true && docker run -d --name docugen_ai_platform -p 8000:8000 -p 8001:8001 -p 8002:8002 -v /opt/docugen/data:/app/data -v /opt/docugen/generated_services:/app/generated_services -e GEMINI_API_KEY='$GEMINI_API_KEY' $CI_REGISTRY_IMAGE:latest"
    - echo "Deployment script finished successfully."
  environment:
    name: production
    url: http://$SERVER_IP:8000
  only:
    - main
    - master
  when: manual
